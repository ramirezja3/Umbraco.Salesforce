name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # No sibling ../Umbraco.Automate checkout in CI, so every project's Exists() check falls
      # back to the real Umbraco.Automate.Core / Umbraco.Automate.OpenIddict NuGet packages
      # pinned in Directory.Packages.props automatically — no UseProjectReferences flag needed.
      #
      # Live-org integration tests no-op without local Salesforce credentials (see
      # LiveSalesforce/LiveSalesforceCredentials.cs) so only the unit suite runs here.
      - name: Unit tests
        run: >
          dotnet test tests/Automate.Salesforce.Connector.Tests.Unit/Automate.Salesforce.Connector.Tests.Unit.csproj
          --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      # Builds again with -p:UseProjectReferences=false explicitly (belt-and-suspenders even
      # though CI has no sibling checkout) and packs — see scripts/pack-release.ps1's own
      # comment for why -SkipBuild must never be passed here.
      - name: Pack
        run: pwsh ./scripts/pack-release.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nupkg/*.nupkg
